name: Setup action verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Workflow security and candidate contract regressions
        shell: pwsh
        run: |
          python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'YAML tooling installation failed' }
          python scripts/test-workflows.py
          if ($LASTEXITCODE -ne 0) { throw 'Workflow security regressions failed' }
          python scripts/check-workflows.py .
          if ($LASTEXITCODE -ne 0) { throw 'Workflow security gate failed' }
          node --test scripts/verify-candidate.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate identity regressions failed' }
      - name: Adversarial setup regressions
        run: node --test setup/test/setup.test.mjs
      - uses: ./setup
        with:
          version: 1.0.16
          cache: 'false'
          install-dir: ${{ runner.temp }}/fidan candidate with spaces
      - name: Verify installed release
        run: fidan --version
      - name: Exercise cache path with the same independently verified release
        uses: ./setup
        with:
          version: 1.0.16
          cache: 'true'
          install-dir: ${{ runner.temp }}/fidan candidate with spaces
      - name: Verify cached executable
        run: fidan --version
