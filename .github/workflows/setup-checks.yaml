name: Setup action verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Adversarial setup regressions
        run: node --test setup/test/setup.test.mjs
      - uses: ./setup
        with:
          version: 1.0.16
          cache: 'false'
      - name: Verify installed release
        run: fidan --version
