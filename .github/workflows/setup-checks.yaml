name: Setup action verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Adversarial setup regressions
        run: node --test setup/test/setup.test.mjs
      - uses: ./setup
        with:
          version: 1.0.16
          cache: 'false'
      - name: Verify installed release
        run: fidan --version
